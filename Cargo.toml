[workspace]
resolver = "2"
members = [
  "crates/lso-core",
  "crates/lso-sensor",
  "crates/lso-engine",
  "crates/lso-actuator",
  "crates/lso-ai",
  "crates/lso-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
tempfile = "3"
